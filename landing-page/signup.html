<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Price Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="container">
        <h1>Sign Up</h1>
        <!-- Initial signup form -->
        <div id="signupForm">
            <form id="signupForm">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password:</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <div id="passwordError" class="error-message" style="display: none; color: red;">
                    Passwords do not match
                </div>
                <button type="submit" class="btn">Sign Up</button>
            </form>
        </div>
        
        <!-- Verification form (hidden initially) -->
        <div id="verificationForm" style="display: none;">
            <h2>Verify Your Email</h2>
            <p>Please enter the 6-digit code sent to your email</p>
            <form id="codeVerificationForm">
                <div class="form-group">
                    <input type="text" id="verificationCode" 
                           pattern="[0-9]{6}" 
                           maxlength="6" 
                           required>
                </div>
                <button type="submit" class="btn">Verify</button>
            </form>
            <div class="counterDiv">
                <p>Time remaining: <span id="counter">15:00</span></p>
            </div>
            <div id="verificationSuccess" style="display: none;"></div>
            <button type="submit" class="btn" id="resendButton">Resend</button>
            <button type="submit" class="btn" id="verifyButton">Verify</button>
        </div>
        
    </div>

    <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        
        // Check if passwords match
        if (password !== confirmPassword) {
            document.getElementById('passwordError').style.display = 'block';
            return;
        }
        document.getElementById('passwordError').style.display = 'none';

        try {
            // TODO: Uncomment for production
            /* const response = await fetch(`https://${API_ID}.execute-api.${AWS_REGION}.amazonaws.com/prod/signup`, {
                method: 'POST',
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: password
                })
            });
            const data = await response.json(); */

            // TESTING: Simulate API response
            let data;
            const email = document.getElementById('email').value;
            if (email && password) {
                data = { success: true };
            } else {
                data = { 
                    success: false,
                    message: 'Email and password are required'
                };
            }

            if (data.success) {
                document.getElementById('signupForm').style.display = 'none';
                document.getElementById('verificationForm').style.display = 'block';
                startCountdown();
            } else {
                alert(data.message || 'Signup failed');
            }
        } catch (err) {
            alert('Signup failed: ' + err.message);
        }
    });

    function startCountdown(reset = false) {
        // Clear any existing interval
        if (window.counterId) {
            clearInterval(window.counterId);
        }

        let timeLeft = 15 * 60; // 15 minutes in seconds
        window.counterId = setInterval(() => {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('counter').textContent = 
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                clearInterval(window.counterId);
                alert('Verification code expired. Please request a new one.');
                window.location.reload();
            }
            timeLeft--;
        }, 1000);
    }

    document.getElementById('resendButton').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        try {
            const response = await fetch(`https://${API_ID}.execute-api.${AWS_REGION}.amazonaws.com/prod/signup`, {
                method: 'POST',
                body: JSON.stringify({
                    email: email,
                    password: '',
                    regenerate_code: true
                })
            });
            const data = await response.json();
            if (data.success) {
                startCountdown(true);
                alert('New verification code sent to your email');
            }
        } catch (err) {
            alert('Failed to resend code: ' + err.message);
        }
    });

    // Handle verification code submission
    document.getElementById('codeVerificationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const response = await fetch(`https://${API_ID}.execute-api.${AWS_REGION}.amazonaws.com/prod/verify`, {
                method: 'POST',
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    code: document.getElementById('verificationCode').value
                })
            });
            const data = await response.json();
            if (response.status === 200) {
                alert('Email verified! Please login.');
                window.location.href = 'login.html';
            } else {
                alert('Verification failed: ' + data.message);
            }
        } catch (err) {
            alert('Verification failed: ' + err.message);
        }
    });
    </script>
</body>
</html>
