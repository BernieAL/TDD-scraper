version: '3.8'

services:
  # Frontend LocalStack (for S3 and CloudFront)
  frontend-localstack:
    image: localstack/localstack:latest
    ports:
      - "4567:4566"  # Different port for frontend services
    environment:
      - SERVICES=s3,cloudfront
      - DEBUG=1
      - AWS_DEFAULT_REGION=us-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${FRONTEND_LOCALSTACK_VOLUME_DIR:-./frontend/localstack/volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - frontend-network

  # Backend LocalStack (for Lambda, ECS, and data S3)
  backend-localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"  # Main port for backend services
    environment:
      - SERVICES=lambda,s3,ecs
      - DEBUG=1
      - AWS_DEFAULT_REGION=us-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${BACKEND_LOCALSTACK_VOLUME_DIR:-./backend/localstack/volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - backend-network

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge 